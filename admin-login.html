<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koneksyon Admin — SISI SAPOTAY</title>
<meta name="theme-color" content="#6d2c05">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#4b210d;font-family:Arial,sans-serif;color:#3d210f;padding:20px}.card{width:min(440px,100%);background:#fff7e8;border-radius:24px;padding:34px;box-shadow:0 24px 70px #0006;border:1px solid #d7a85a}.logo{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#8a3f12;color:#ffbd35;font-weight:900;font-size:27px;border:4px solid #d7a23b}h1{text-align:center;margin:0 0 5px;color:#6d2c05}p{text-align:center;color:#75543d;line-height:1.45}label{display:block;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px 15px;border:1px solid #cbb69f;border-radius:12px;font-size:16px;background:white}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:20px;background:#b85b16;color:white;font-size:16px;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:13px;text-align:center;font-weight:700;color:#a3261b}.small{font-size:12px;color:#8a715f;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<div class="logo">SS</div>
<h1>SISI SAPOTAY</h1>
<p><b>Koneksyon Administratè</b><br>Espas sa a rezève pou responsab otorize.</p>
<label for="email">Imèl</label><input id="email" type="email" autocomplete="username" placeholder="Imèl administratè">
<label for="password">Modpas</label><input id="password" type="password" autocomplete="current-password" placeholder="Modpas">
<button id="loginBtn">KONEKTE</button>
<div id="msg" class="msg"></div>
<p class="small">Modpas la pa anrejistre nan paj sa a.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
const cfg=window.SISI_CLOUD||{};
const sb=(window.supabase&&cfg.SUPABASE_URL&&cfg.SUPABASE_PUBLISHABLE_KEY)?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;
async function go(){
 if(!sb){msg.textContent='Konfigirasyon Cloud la pa disponib.';return}
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password){msg.textContent='Antre imel ak modpas la.';return}
 btn.disabled=true;msg.textContent='Koneksyon...';
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){msg.textContent='Koneksyon pa reyisi. Verifye imel/modpas la.';btn.disabled=false;return}
 const {data:ok,error:adminErr}=await sb.rpc('is_sisi_admin');
 if(adminErr||ok!==true){await sb.auth.signOut();msg.textContent='Kont sa a pa gen dwa Administratè.';btn.disabled=false;return}
 localStorage.setItem('SISI_ADMIN_EMAIL',email);
 location.replace('admin.html');
}
btn.addEventListener('click',go);document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body></html>
